[project]
name = "rehearsal"
version = "0.1.0"
description = "Optimal rehearsal scheduling for music ensembles"
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
schedule = "rehearsal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rehearsal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is not a package, so without this pytest puts tests/ on sys.path rather than
# the project root and `from tests.conftest import build` cannot resolve.
pythonpath = ["."]
